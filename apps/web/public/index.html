<!doctype html>
<html lang="id">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Office — 3D Office (Three.js)</title>
  <link rel="stylesheet" href="/styles/tailwind.css" />
  <header class="absolute top-4 left-4 z-10 pointer-events-none">
    <h1 id="title" class="text-[#4fc3f7] text-sm pointer-events-auto mb-1">AI Office</h1>
    <div id="subtitle" class="text-[#889097] text-xs pointer-events-auto">memuat floor…</div>
  </header>
  <div id="canvas"></div>
  <div id="notices-panel" class="bg-[#11141b] border-l border-[#23303a] overflow-y-auto z-20 p-4">
    <h2 class="text-[#4fc3f7] text-sm mb-3">Notice Board</h2>
    <div id="notices-list">belum ada notice</div>
    <form id="notices-form" class="flex flex-col gap-[0.4rem] mt-4 pt-4 border-t border-[#23303a]">
      <input id="notice-title" placeholder="Judul" required class="bg-[#0b0c10] border border-[#23303a] text-[#c5c6c7] p-[0.4rem] rounded-[4px] text-xs w-full" />
      <textarea id="notice-content" placeholder="Isi notice" required class="bg-[#0b0c10] border border-[#23303a] text-[#c5c6c7] p-[0.4rem] rounded-[4px] text-xs w-full min-h-[60px]"></textarea>
      <input id="notice-author" placeholder="Penulis" required class="bg-[#0b0c10] border border-[#23303a] text-[#c5c6c7] p-[0.4rem] rounded-[4px] text-xs w-full" />
      <button type="submit" class="bg-[#4fc3f7] text-[#0b0c10] border-none p-[0.5rem] rounded-[4px] font-semibold cursor-pointer">Buat</button>
    </form>
    <div id="notices-msg" class="msg hidden p-2 text-xs rounded-sm"></div>
  </div>
  <div id="status" class="absolute bottom-4 left-4 z-10 text-xs text-[#889097] pointer-events-none">siap</div>
  <script type="importmap">
    {
      "imports": {
        "three": "/three/build/three.module.js",
        "three/addons/": "/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/app.js"></script>
</html>
