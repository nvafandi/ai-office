<!doctype html>
<html lang="id">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Office — 3D Office (Three.js)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #canvas { width: 100%; height: 100%; background: #0b0c10; color: #c5c6c7; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    #canvas { position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    header { position: absolute; top: 1rem; left: 1rem; z-index: 10; pointer-events: none; }
    h1 { font-size: 1rem; color: #4fc3f7; pointer-events: auto; margin-bottom: 0.25rem; }
    .muted { color: #889097; font-size: 0.8rem; pointer-events: auto; }
    #status { position: absolute; bottom: 1rem; left: 1rem; z-index: 10; font-size: 0.8rem; color: #889097; pointer-events: none; }
    .floor-label { position: absolute; z-index: 10; background: rgba(11,12,16,0.85); border: 1px solid #45a29e; color: #4fc3f7; padding: 0.35rem 0.6rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; user-select: none; pointer-events: auto; white-space: nowrap; }
    .floor-label:hover { background: #161d25; }
    .floor-label.active { color: #fff; border-color: #4fc3f7; }
  </style>
  <header>
    <h1 id="title">AI Office</h1>
    <div class="muted" id="subtitle">memuat floor…</div>
  </header>
  <div id="canvas"></div>
  <div id="status">siap</div>
  <script type="importmap">
    {
      "imports": {
        "three": "/three/build/three.module.js",
        "three/addons/": "/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/app.js"></script>
</html>
